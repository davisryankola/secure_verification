<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Champion</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #10b981;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #10b981; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge {
            font-size: 4rem;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🏆</div>
        <h1>Verification Successful!</h1>
        <p>Congratulations. You have officially claimed your Thika MSME Security Champion digital badge.</p>
        <p>Thank you for keeping our network safe.</p>
    </div>
</body>
</html>
